# ============================================
# NanoAiCanvas Nginx 配置（裸机部署版）
# 适配 base path: /nanoaicanvas/
# ============================================

# 后端上游
upstream nanoai_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    # --- 前端静态文件 ---
    location /nanoaicanvas/ {
        alias /opt/nanoai/dist/;
        index index.html;
        try_files $uri $uri/ /nanoaicanvas/index.html;

        # 静态资源缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            alias /opt/nanoai/dist/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # --- 后端 API 代理 ---
    # /nanoaicanvas/api/* → 后端 /api/*
    location /nanoaicanvas/api/ {
        proxy_pass http://nanoai_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # /nanoaicanvas/auth/* → 后端 /api/auth/*
    location /nanoaicanvas/auth/ {
        proxy_pass http://nanoai_api/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /nanoaicanvas/v2/* → 后端 /v2/*
    location /nanoaicanvas/v2/ {
        proxy_pass http://nanoai_api/v2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # --- WebSocket ---
    location /nanoaicanvas/ws/ {
        proxy_pass http://nanoai_api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # --- 文件上传 ---
    location /nanoaicanvas/chat-uploads/ {
        proxy_pass http://nanoai_api/chat-uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /nanoaicanvas/asset-uploads/ {
        proxy_pass http://nanoai_api/asset-uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- 健康检查 ---
    location /nanoaicanvas/health {
        proxy_pass http://nanoai_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- 直通路由（兼容直接访问） ---
    location /api/ {
        proxy_pass http://nanoai_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /v2/ {
        proxy_pass http://nanoai_api/v2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://nanoai_api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /chat-uploads/ {
        proxy_pass http://nanoai_api/chat-uploads/;
    }

    location /asset-uploads/ {
        proxy_pass http://nanoai_api/asset-uploads/;
    }

    location /health {
        proxy_pass http://nanoai_api/health;
    }

    # --- 根路径重定向 ---
    location = / {
        return 302 /nanoaicanvas/;
    }
}
