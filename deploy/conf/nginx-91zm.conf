# ============================================
# 91zm.com.cn — 宿主机 Nginx 反代 Docker (HOST_PORT=8080)
# 位置: /etc/nginx/sites-available/91zm
# 启用: ln -s /etc/nginx/sites-available/91zm /etc/nginx/sites-enabled/
# 证书: certbot --nginx -d 91zm.com.cn 会自动改写本文件补 SSL 段
# ============================================

server {
    listen 80;
    server_name 91zm.com.cn;

    # 大文件上传（资产/图片）
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（chat / agent 双向通信）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE（TVC 工作流进度推送）— 必须关闭缓冲
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
