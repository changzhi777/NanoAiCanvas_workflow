upstream fe {
    server frontend:3000;
    keepalive 16;
}

upstream api {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100m;

    # 前端
    location / {
        proxy_pass http://fe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Nano2 独立入口 — 确保 SPA fallback 生效
    location /nano2 {
        proxy_pass http://fe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NanoAI Canvas 入口（/nanoai 子路径部署） — 确保 SPA fallback 生效
    location /nanoai {
        proxy_pass http://fe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /nanoai 前缀 API 路由 — 剥 /nanoai 前缀转发后端（最长前缀优先于 location /nanoai）
    location /nanoai/api/ {
        proxy_pass http://api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    location /nanoai/v2/ {
        proxy_pass http://api/v2/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location /nanoai/ws/ {
        proxy_pass http://api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /nanoai/chat-uploads/ {
        proxy_pass http://api/chat-uploads/;
    }

    location /nanoai/asset-uploads/ {
        proxy_pass http://api/asset-uploads/;
    }

    location /nanoai/health {
        proxy_pass http://api/health;
    }

    # Canvas 入口
    location /canvas {
        proxy_pass http://fe;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # V2 API
    location /v2/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # 聊天文件
    location /chat-uploads/ {
        proxy_pass http://api;
    }

    # 资产本地存储
    location /asset-uploads/ {
        proxy_pass http://api;
    }

    # Health
    location /health {
        proxy_pass http://api;
    }
}
