<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NanoAi无限画布 · 系统架构图</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFFFF; --paper-2: #F0F6FF;
    --ink: #1E3A8A; --body: #334155;
    --muted: #64748B; --soft: #94A3B8;
    --accent: #1E40AF; --accent-2: #3B82F6;
    --accent-tint: #DBEAFE; --rule: #DBEAFE;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans SC', 'PingFang SC', sans-serif;
    background: var(--paper); color: var(--body);
    max-width: 960px; margin: 0 auto; padding: 40px 32px;
  }
  .eyebrow {
    font-family: 'Geist Mono', monospace; font-size: 11px;
    letter-spacing: .16em; color: var(--accent-2); font-weight: 600;
    text-transform: uppercase; margin-bottom: 8px;
  }
  h1 { font-size: 26px; color: var(--ink); font-weight: 700; margin-bottom: 6px; }
  .sub { font-size: 14px; color: var(--muted); margin-bottom: 24px; }
  .frame {
    background: var(--paper-2); border: 1px solid var(--rule);
    border-radius: 8px; padding: 16px; overflow-x: auto;
  }
  .colophon {
    margin-top: 16px; padding-top: 12px;
    border-top: 1px solid rgba(30,58,138,.12);
    font-family: 'Geist Mono', monospace; font-size: 10px;
    color: var(--soft); letter-spacing: .08em;
  }
</style>
</head>
<body>
  <p class="eyebrow">SYSTEM ARCHITECTURE</p>
  <h1>NanoAi无限画布 · 分布式任务执行架构</h1>
  <p class="sub">NanoAi Node 算力池 + 错峰调度：白天下单审稿，夜间满负荷执行</p>

  <div class="frame">
  <svg viewBox="0 0 880 460" role="img" aria-labelledby="zaji-arch-title zaji-arch-desc" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto;display:block">
    <title id="zaji-arch-title">NanoAi无限画布分布式任务执行架构</title>
    <desc id="zaji-arch-desc">架构图：创作者向 NanoAi 无限画布平台提交任务，平台分配算力至 NanoAi Node 分布式算力池，夜间排队并行执行后回传产出，创作者早上审稿验收；底部为白天下单审稿、夜间满负荷执行、早上验收交付的错峰调度时序。</desc>
    <defs>
      <marker id="za-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
      </marker>
      <marker id="za-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1E40AF"/>
      </marker>
      <marker id="za-arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
        <polygon points="0 0, 8 3, 0 6" fill="#1E40AF"/>
      </marker>
    </defs>

    <rect width="100%" height="100%" fill="#FFFFFF"/>

    <!-- ═══ 箭头（先画，节点后画压线） ═══ -->

    <!-- A1 提交任务：创作者右缘 → 平台左缘（同 y=104，直线） -->
    <line x1="200" y1="104" x2="312" y2="104" stroke="#64748B" stroke-width="1.4" marker-end="url(#za-arrow)"/>
    <rect x="212" y="84" width="72" height="13" rx="2" fill="#FFFFFF"/>
    <text x="248" y="94" fill="#64748B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">提交任务</text>

    <!-- A2 算力分配：平台右缘 → Node池左缘（同 y=104，直线，accent 主线） -->
    <line x1="560" y1="104" x2="632" y2="104" stroke="#1E40AF" stroke-width="1.6" marker-end="url(#za-arrow-accent)"/>
    <rect x="568" y="84" width="72" height="13" rx="2" fill="#FFFFFF"/>
    <text x="604" y="94" fill="#1E40AF" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">算力分配</text>

    <!-- A3 夜间并行执行·回传：Node池底(748,192) ↓ y=244 ← 平台底(432,244) ↑ 平台底缘(432,160)。正交圆角 -->
    <path d="M 748 192 L 748 236 Q 748 244 740 244 L 440 244 Q 432 244 432 236 L 432 168"
          fill="none" stroke="#1E40AF" stroke-width="1.6" stroke-dasharray="5,4" marker-end="url(#za-arrow-accent)"/>
    <rect x="480" y="224" width="200" height="13" rx="2" fill="#FFFFFF"/>
    <text x="580" y="234" fill="#1E40AF" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">夜间排队并行执行 · 产出回传</text>

    <!-- A4 早上审稿验收（虚线回环）：平台左缘下附点(368,152) ↓ y=292 ← 创作者底(112,292) ↑ 创作者底缘(112,144) -->
    <path d="M 368 152 L 368 284 Q 368 292 360 292 L 120 292 Q 112 292 112 284 L 112 152"
          fill="none" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#za-arrow)"/>
    <rect x="196" y="272" width="88" height="13" rx="2" fill="#FFFFFF"/>
    <text x="240" y="282" fill="#94A3B8" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">早上审稿验收</text>

    <!-- ═══ 节点 ═══ -->

    <!-- 创作者（Input/User：muted tint） -->
    <rect x="40" y="64" width="160" height="80" rx="6" fill="#FFFFFF"/>
    <rect x="40" y="64" width="160" height="80" rx="6" fill="#64748B" opacity="0.06"/>
    <rect x="40" y="64" width="160" height="80" rx="6" fill="none" stroke="#94A3B8" stroke-width="1"/>
    <rect x="48" y="70" width="36" height="13" rx="2" fill="none" stroke="#94A3B8" stroke-width="0.8" opacity="0.5"/>
    <text x="66" y="80" fill="#94A3B8" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
    <text x="120" y="102" fill="#1E3A8A" font-size="13" font-weight="600" font-family="'Noto Sans SC', sans-serif" text-anchor="middle">创作者</text>
    <text x="120" y="122" fill="#64748B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">白天下计划任务</text>

    <!-- NanoAi 无限画布平台（FOCAL：accent-tint + accent 描边） -->
    <rect x="312" y="56" width="248" height="104" rx="6" fill="#DBEAFE"/>
    <rect x="312" y="56" width="248" height="104" rx="6" fill="none" stroke="#1E40AF" stroke-width="1.4"/>
    <rect x="320" y="62" width="52" height="13" rx="2" fill="none" stroke="#1E40AF" stroke-width="0.8" opacity="0.5"/>
    <text x="346" y="72" fill="#1E40AF" font-size="7.5" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PLATFORM</text>
    <text x="436" y="94" fill="#1E3A8A" font-size="14" font-weight="700" font-family="'Noto Sans SC', sans-serif" text-anchor="middle">NanoAi 无限画布平台</text>
    <text x="436" y="116" fill="#1E40AF" font-size="10" font-family="'Noto Sans SC', sans-serif" text-anchor="middle">任务编排 · 算力分配 · 队列调度 · 质量验收</text>
    <text x="436" y="138" fill="#64748B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DeepSeek-V4-Pro · 生图 · 视频 · MiniMax TTS</text>

    <!-- NanoAi Node 算力池（Boundary：dashed） -->
    <rect x="632" y="32" width="216" height="160" rx="6" fill="#1E40AF" opacity="0.04"/>
    <rect x="632" y="32" width="216" height="160" rx="6" fill="none" stroke="#1E40AF" stroke-width="1" stroke-dasharray="4,4" opacity="0.55"/>
    <text x="740" y="52" fill="#1E40AF" font-size="10" font-weight="600" font-family="'Noto Sans SC', sans-serif" text-anchor="middle">NanoAi Node 算力池</text>

    <!-- Node 子节点 ×3（Store：ink tint） -->
    <rect x="656" y="64" width="168" height="32" rx="4" fill="#1E3A8A" opacity="0.05"/>
    <rect x="656" y="64" width="168" height="32" rx="4" fill="none" stroke="#64748B" stroke-width="0.9"/>
    <text x="740" y="77" fill="#1E3A8A" font-size="10.5" font-weight="600" font-family="'Noto Sans SC', sans-serif" text-anchor="middle">Node ① · 生图算力</text>
    <text x="740" y="90" fill="#64748B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">GPU WORKER</text>

    <rect x="656" y="104" width="168" height="32" rx="4" fill="#1E3A8A" opacity="0.05"/>
    <rect x="656" y="104" width="168" height="32" rx="4" fill="none" stroke="#64748B" stroke-width="0.9"/>
    <text x="740" y="117" fill="#1E3A8A" font-size="10.5" font-weight="600" font-family="'Noto Sans SC', sans-serif" text-anchor="middle">Node ② · 视频算力</text>
    <text x="740" y="130" fill="#64748B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">RENDER WORKER</text>

    <rect x="656" y="144" width="168" height="32" rx="4" fill="#1E3A8A" opacity="0.05"/>
    <rect x="656" y="144" width="168" height="32" rx="4" fill="none" stroke="#64748B" stroke-width="0.9" stroke-dasharray="4,3"/>
    <text x="740" y="157" fill="#1E3A8A" font-size="10.5" font-weight="600" font-family="'Noto Sans SC', sans-serif" text-anchor="middle">Node N · 弹性扩缩</text>
    <text x="740" y="170" fill="#64748B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">GO RUNTIME · 单二进制</text>

    <!-- ═══ 错峰调度时序条 ═══ -->
    <rect x="40" y="320" width="808" height="72" rx="6" fill="#F0F6FF"/>
    <rect x="40" y="320" width="808" height="72" rx="6" fill="none" stroke="#DBEAFE" stroke-width="1"/>
    <text x="56" y="342" fill="#1E3A8A" font-size="11" font-weight="700" font-family="'Noto Sans SC', sans-serif">错峰调度时序</text>

    <rect x="56" y="352" width="240" height="28" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.9"/>
    <text x="176" y="370" fill="#334155" font-size="10.5" font-family="'Noto Sans SC', sans-serif" text-anchor="middle">白天 · 下单 + 质量审查</text>
    <line x1="304" y1="366" x2="328" y2="366" stroke="#64748B" stroke-width="1.2" marker-end="url(#za-arrow)"/>
    <rect x="336" y="352" width="264" height="28" rx="4" fill="#1E40AF"/>
    <text x="468" y="370" fill="#FFFFFF" font-size="10.5" font-weight="600" font-family="'Noto Sans SC', sans-serif" text-anchor="middle">夜间 · Node 池排队满负荷执行</text>
    <line x1="608" y1="366" x2="632" y2="366" stroke="#64748B" stroke-width="1.2" marker-end="url(#za-arrow)"/>
    <rect x="640" y="352" width="192" height="28" rx="4" fill="#FFFFFF" stroke="#94A3B8" stroke-width="0.9"/>
    <text x="736" y="370" fill="#334155" font-size="10.5" font-family="'Noto Sans SC', sans-serif" text-anchor="middle">早上 · 产出验收交付</text>

    <!-- ═══ Legend（底部横条） ═══ -->
    <line x1="40" y1="416" x2="848" y2="416" stroke="rgba(30,58,138,0.12)" stroke-width="0.8"/>
    <text x="40" y="434" fill="#64748B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
    <rect x="112" y="425" width="12" height="12" rx="2" fill="#DBEAFE" stroke="#1E40AF" stroke-width="1"/>
    <text x="130" y="434" fill="#64748B" font-size="9" font-family="'Noto Sans SC', sans-serif">平台中枢</text>
    <rect x="196" y="425" width="12" height="12" rx="2" fill="#1E3A8A" opacity="0.05"/>
    <rect x="196" y="425" width="12" height="12" rx="2" fill="none" stroke="#64748B" stroke-width="0.8"/>
    <text x="214" y="434" fill="#64748B" font-size="9" font-family="'Noto Sans SC', sans-serif">算力节点</text>
    <line x1="286" y1="431" x2="314" y2="431" stroke="#1E40AF" stroke-width="1.6"/>
    <text x="320" y="434" fill="#64748B" font-size="9" font-family="'Noto Sans SC', sans-serif">算力分配 / 执行回传</text>
    <line x1="436" y1="431" x2="464" y2="431" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="470" y="434" fill="#64748B" font-size="9" font-family="'Noto Sans SC', sans-serif">审稿回环</text>
    <rect x="556" y="425" width="12" height="12" rx="2" fill="none" stroke="#1E40AF" stroke-width="0.8" stroke-dasharray="4,4" opacity="0.55"/>
    <text x="574" y="434" fill="#64748B" font-size="9" font-family="'Noto Sans SC', sans-serif">算力池边界（弹性扩缩）</text>
  </svg>
  </div>

  <p class="colophon">NANOAI INFINITE CANVAS · DISTRIBUTED EXECUTION TOPOLOGY · GO-POWERED NODE FLEET</p>
</body>
</html>
